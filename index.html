<!doctype html>
<html lang="si" data-theme="dark" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Links</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&amp;family=Poppins:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:linear-gradient(160deg,#f3efff 0%,#fdf0f8 55%,#fff4ec 100%);--card:rgba(255,255,255,.78);--bd:rgba(124,58,237,.14);--text:#1f1b2e;--muted:#6d6985;--accent:#7c3aed;--accent2:#ec4899;--ic:rgba(124,58,237,.1);--field:#fff;--sh:0 8px 28px rgba(124,58,237,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:linear-gradient(160deg,#12101f 0%,#1b1030 55%,#240f26 100%);--card:rgba(32,28,52,.78);--bd:rgba(167,139,250,.2);--text:#f1eeff;--muted:#a9a3c4;--accent:#a78bfa;--accent2:#f472b6;--ic:rgba(167,139,250,.16);--field:#171428;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:linear-gradient(160deg,#12101f 0%,#1b1030 55%,#240f26 100%);--card:rgba(32,28,52,.78);--bd:rgba(167,139,250,.2);--text:#f1eeff;--muted:#a9a3c4;--accent:#a78bfa;--accent2:#f472b6;--ic:rgba(167,139,250,.16);--field:#171428;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background-attachment:fixed;color:var(--text);font-family:'Noto Sans Sinhala','Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:36px 18px 56px}
.hero{text-align:center;margin-bottom:28px}
.avatar{width:96px;height:96px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:44px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px rgba(236,72,153,.35);border:4px solid var(--card)}
h1{margin:0 0 6px;font-size:26px;font-weight:700}
.hero p{margin:0 auto;max-width:420px;color:var(--muted)}
h2{font-size:15px;letter-spacing:.02em;margin:28px 0 12px;font-weight:700}
h3{font-size:14px;margin:22px 0 10px;color:var(--muted)}
.link{display:flex;align-items:center;gap:14px;padding:13px 16px;margin-bottom:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);color:inherit;text-decoration:none;backdrop-filter:blur(10px);transition:transform .2s,box-shadow .2s}
.link:hover,.link:focus-visible{transform:translateY(-3px);box-shadow:0 14px 34px rgba(124,58,237,.22);outline:none}
.ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--ic);flex:none}
.tt{flex:1;font-weight:600;overflow-wrap:anywhere}
.ar{font-size:24px;color:var(--accent);line-height:1}
.ad{position:relative;display:block;margin-bottom:14px;padding:20px 20px 18px;border-radius:20px;color:#fff;text-decoration:none;background:linear-gradient(135deg,#7c3aed,#ec4899);box-shadow:0 12px 32px rgba(236,72,153,.32);transition:transform .2s}
.ad:hover,.ad:focus-visible{transform:translateY(-3px) scale(1.01);outline:none}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.25);margin-bottom:8px}
.ad b{display:block;font-size:18px;margin-bottom:4px}
.ad span.d{display:block;opacity:.92;font-size:14px;margin-bottom:14px}
.cta{display:inline-block;padding:8px 20px;border-radius:99px;background:#fff;color:#7c3aed;font-weight:700;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:14px}
footer{text-align:center;margin-top:34px;color:var(--muted);font-size:12px}
.btn{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:99px;padding:10px 22px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(124,58,237,.3)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--bd);box-shadow:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.grid{display:flex;gap:8px;margin-bottom:8px}
input{width:100%;font:inherit;font-size:14px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--bd);border-radius:10px;background:var(--field);color:var(--text)}
.grid input{margin-bottom:0}
input.sm{width:64px;flex:none;text-align:center}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.ctl{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.ctl button{cursor:pointer;border:1px solid var(--bd);background:var(--field);color:var(--text);border-radius:8px;padding:3px 10px;font-size:13px}
.bar{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--field);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
.hero,.link,.ad{animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="toast" class=""></div>
<script id="state" type="application/json">{"profile":{"avatar":"✨","name":"ඔබේ නම","bio":"මගේ සියලුම links සහ දැන්වීම් එකම තැනකින්"},"links":[{"icon":"📘","title":"Facebook Page","url":"https://facebook.com"},{"icon":"▶️","title":"YouTube Channel","url":"https://www.youtube.com/@baymaxofficeil"},{"icon":"📸","title":"Instagram","url":"https://instagram.com"},{"icon":"💬","title":"WhatsApp","url":"Follow the Minekolla TT channel on WhatsApp: https://whatsapp.com/channel/0029Vb9K5cl5vKAALinUFs1e"}],"ads":[{"title":"ඔබේ දැන්වීම මෙතන","text":"පහළ ඇති Edit බොත්තම ඔබා ඔබේ ad එක දාන්න.","url":"https://example.com","cta":"බලන්න"}]}</script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let state=JSON.parse($('#state').textContent),draft=null,canEdit=false,editing=false;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>{u=String(u||'').trim();if(/^(https?:|mailto:|tel:)/i.test(u))return u;if(/^[\w-]+(\.[\w-]+)+/.test(u))return 'https://'+u;return '#'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}

function view(){
  editing=false;const p=state.profile;
  app.innerHTML=`<header class="hero"><div class="avatar">${esc(p.avatar||[...(p.name||'✨')][0])}</div><h1>${esc(p.name)}</h1><p>${esc(p.bio)}</p></header>
  <section><h2>🔗 මගේ Links</h2>${state.links.length?state.links.map(l=>`<a class="link" href="${esc(safe(l.url))}" target="_blank" rel="noopener noreferrer"><span class="ic">${esc(l.icon||'🔗')}</span><span class="tt">${esc(l.title)}</span><span class="ar">›</span></a>`).join(''):'<p class="empty">තවම links නැහැ</p>'}</section>
  ${state.ads.length?`<section><h2>📣 විශේෂ දැන්වීම්</h2>${state.ads.map(a=>`<a class="ad" href="${esc(safe(a.url))}" target="_blank" rel="noopener noreferrer sponsored"><span class="tag">Ad</span><b>${esc(a.title)}</b><span class="d">${esc(a.text)}</span><span class="cta">${esc(a.cta||'බලන්න')} →</span></a>`).join('')}</section>`:''}
  <footer>${canEdit?'<button class="btn" data-act="edit">✏️ Edit කරන්න</button>':''}</footer>`;
}

const inp=(l,i,k,v,ph,c='')=>`<input class="${c}" data-l="${l}" data-i="${i}" data-k="${k}" value="${esc(v)}" placeholder="${ph}">`;
const ctl=(l,i)=>`<div class="ctl"><button data-act="up" data-l="${l}" data-i="${i}" aria-label="Up">▲</button><button data-act="down" data-l="${l}" data-i="${i}" aria-label="Down">▼</button><button data-act="del" data-l="${l}" data-i="${i}" aria-label="Delete">🗑</button></div>`;
function edit(){
  editing=true;const d=draft;
  app.innerHTML=`<h2>⚙️ සංස්කරණය</h2>
  <div class="card"><div class="grid" style="margin-bottom:8px">${inp('profile',0,'avatar',d.profile.avatar,'😀','sm')}${inp('profile',0,'name',d.profile.name,'ඔබේ නම')}</div>${inp('profile',0,'bio',d.profile.bio,'කෙටි විස්තරයක්')}</div>
  <h3>🔗 Links</h3>
  ${d.links.map((l,i)=>`<div class="card">${ctl('links',i)}<div class="grid" style="margin-bottom:8px">${inp('links',i,'icon',l.icon,'🔗','sm')}${inp('links',i,'title',l.title,'Title')}</div>${inp('links',i,'url',l.url,'https://')}</div>`).join('')}
  <button class="btn ghost" data-act="add" data-l="links">+ Link එකක්</button>
  <h3>📣 Ads</h3>
  ${d.ads.map((a,i)=>`<div class="card">${ctl('ads',i)}${inp('ads',i,'title',a.title,'Ad title')}${inp('ads',i,'text',a.text,'විස්තරය')}${inp('ads',i,'url',a.url,'https://')}${inp('ads',i,'cta',a.cta,'Button text')}</div>`).join('')}
  <button class="btn ghost" data-act="add" data-l="ads">+ Ad එකක්</button>
  <div class="bar"><button class="btn" data-act="save">💾 Save කරන්න</button><button class="btn ghost" data-act="cancel">අවලංගු</button></div>`;
}

app.addEventListener('input',e=>{const t=e.target,{l,i,k}=t.dataset;if(!k)return;if(l==='profile')draft.profile[k]=t.value;else draft[l][+i][k]=t.value});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const {act,l}=b.dataset,i=+b.dataset.i;
  if(act==='edit'){draft=JSON.parse(JSON.stringify(state));edit()}
  else if(act==='cancel')view();
  else if(act==='add'){draft[l].push(l==='links'?{icon:'🔗',title:'',url:''}:{title:'',text:'',url:'',cta:'බලන්න'});edit()}
  else if(act==='del'){draft[l].splice(i,1);edit()}
  else if(act==='up'&&i>0){const a=draft[l];[a[i-1],a[i]]=[a[i],a[i-1]];edit()}
  else if(act==='down'&&i<draft[l].length-1){const a=draft[l];[a[i+1],a[i]]=[a[i],a[i+1]];edit()}
  else if(act==='save')save();
});

async function save(){
  let art=null;try{art=await claude.use('artifact')}catch(e){}
  if(!art){toast('මෙතනින් save කරන්න බැහැ');return}
  draft.links=draft.links.filter(x=>x.url.trim()||x.title.trim());
  draft.ads=draft.ads.filter(x=>x.title.trim()||x.url.trim());
  const doc=document.documentElement.cloneNode(true);
  doc.querySelector('#state').textContent=JSON.stringify(draft).replace(/</g,'\\u003c');
  doc.querySelector('#app').innerHTML='';
  doc.querySelector('#toast').innerHTML='';doc.querySelector('#toast').className='';
  try{await art.publish('<!doctype html>\n'+doc.outerHTML)}
  catch(e){toast(e&&e.code==='conflict'?'වෙන වෙනස්කමක් තිබුණා, නැවත try කරන්න':'Save කරන්න බැරි වුණා')}
}

view();
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const u=await claude.use('user');
  canEdit=!!(u&&(u.isOwner()||u.canEdit()));
  if(canEdit&&!editing)view();
}catch(e){}})();
</script>


</body></html>
